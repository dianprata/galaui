 name: Bundle Size Tracker
 
 on:
   pull_request:
     branches: [main, develop]
   push:
     branches: [main, develop]
 
 concurrency:
   group: bundle-size-${{ github.ref }}
   cancel-in-progress: true
 
 jobs:
   size:
     name: Monitor Subpath Bundle Sizes
     runs-on: ubuntu-latest
     permissions:
       contents: read
       pull-requests: write
 
     steps:
       - name: Checkout repository
         uses: actions/checkout@v4
 
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 22
           cache: "npm"
 
       - name: Install dependencies
         run: npm ci
 
       - name: Build library
         run: npm run build:lib
 
       - name: Check bundle size limits and report to PR
         uses: andresz1/size-limit-action@v1
         with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           build_script: build:lib

 name: Bundle Size Tracker
 
 on:
   pull_request:
     branches: [main, develop]
   push:
     branches: [main, develop]
 
 concurrency:
   group: bundle-size-${{ github.ref }}
   cancel-in-progress: true
 
 jobs:
   size:
     name: Monitor Subpath Bundle Sizes
     runs-on: ubuntu-latest
     permissions:
       contents: read
       pull-requests: write
 
     steps:
       - name: Checkout repository
         uses: actions/checkout@v4
 
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 22
           cache: "npm"
 
       - name: Install dependencies
         run: npm ci
 
      - name: Build library
        run: npm run build:lib

      - name: Check bundle size limits
        run: |
          npm run size
          npx size-limit --json > size-report.json

      - name: Report Bundle Size to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('size-report.json')) return;
            const data = JSON.parse(fs.readFileSync('size-report.json', 'utf8'));
            let body = '### 📦 GalaUI Bundle Size Report\n\n';
            body += '| Package / Component | Size (brotlied) | Budget Limit | Status |\n';
            body += '| :--- | :--- | :--- | :--- |\n';
            for (const item of data) {
              const sizeKb = (item.size / 1024).toFixed(2) + ' kB';
              const limitKb = (item.sizeLimit / 1000) + ' kB';
              const status = item.passed ? '✅ Passed' : '❌ Exceeded';
              body += `| \`${item.name}\` | **${sizeKb}** | ${limitKb} | ${status} |\n`;
            }
            body += '\n*Generated by GalaUI Bundle Size Tracker.*';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes('GalaUI Bundle Size Report'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

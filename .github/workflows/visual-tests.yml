 name: Visual Regression Tests
 
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update baseline snapshots'
        type: boolean
        default: false

concurrency:
  group: visual-tests-${{ github.ref }}
   cancel-in-progress: true
 
 jobs:
   visual-tests:
     name: Playwright Visual Regression
     runs-on: ubuntu-latest
 
     steps:
       - name: Checkout repository
         uses: actions/checkout@v4
 
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 22
           cache: "npm"
 
       - name: Install dependencies
         run: npm ci
 
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright visual regression tests
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npm run test:visual:update
          else
            npm run test:visual
          fi

      - name: Upload visual test report on failure
         if: failure()
         uses: actions/upload-artifact@v4
         with:
           name: playwright-visual-report
           path: playwright-report/
           retention-days: 14

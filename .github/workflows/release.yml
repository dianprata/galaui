name: Release & Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (e.g. latest, beta, next)"
        required: true
        default: "latest"

jobs:
  publish:
    name: Publish to npm & GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check library
        run: npx tsc --project tsconfig.build.json --noEmit

      - name: Build library (@galaui/react)
        run: npm run build:lib

      - name: Publish to npm
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CURRENT_NPM_VERSION=$(npm view @galaui/react version 2>/dev/null || echo "")
          if [ "$PACKAGE_VERSION" = "$CURRENT_NPM_VERSION" ]; then
            echo "Version $PACKAGE_VERSION is already published on npm. Skipping publication."
            exit 0
          fi
          DIST_TAG="${{ github.event.inputs.tag || 'latest' }}"
          npm publish --access public --tag "$DIST_TAG" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
